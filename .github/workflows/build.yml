name: Build Impress with Toolbar (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        shell: pwsh
        run: |
          Write-Host "CPUs: $env:NUMBER_OF_PROCESSORS"
          Get-PSDrive C | Select-Object Used,Free
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -ErrorAction SilentlyContinue | Select-Object Name

      - name: Install Cygwin and build deps
        shell: pwsh
        timeout-minutes: 40
        run: |
          $setup = "$env:RUNNER_TEMP\setup-x86_64.exe"
          Invoke-WebRequest -Uri "https://cygwin.com/setup-x86_64.exe" -OutFile $setup -UseBasicParsing
          $pkgs = @(
            "autoconf","automake","bison","cabextract","doxygen","flex","gcc-g++",
            "gettext-devel","git","gnupg","gperf","make","mintty","nasm","openssh",
            "openssl","patch","perl","python3","pkg-config","pkgconf","rsync","unzip","vim",
            "wget","zip","perl-Archive-Zip","perl-Font-TTF","perl-IO-String",
            "perl-XML-Parser","libxml2","libxslt","curl"
          ) -join ","
          $p = Start-Process -FilePath $setup -ArgumentList @(
            "-q","-n","-d","-R","C:\cygwin","-s","https://mirrors.kernel.org/sourceware/cygwin/",
            "-P",$pkgs
          ) -Wait -PassThru -NoNewWindow
          Write-Host "Cygwin setup exit code: $($p.ExitCode)"
          if (-not (Test-Path "C:\cygwin\bin\bash.exe")) { throw "Cygwin install failed" }
          Write-Host "Cygwin OK"

      - name: Clone LibreOffice source
        shell: pwsh
        timeout-minutes: 90
        run: |
          $env:PATH = "C:\cygwin\bin;$env:PATH"
          bash -lc "set -e; cd /cygdrive/d; git clone --depth 1 --branch libreoffice-26-8 https://github.com/LibreOffice/core.git lo; echo CLONE_DONE; du -sh lo"

      - name: Apply toolbar patch
        shell: pwsh
        run: |
          $env:PATH = "C:\cygwin\bin;$env:PATH"
          $ws = & bash -lc "cygpath -u '$env:GITHUB_WORKSPACE'"
          & bash -lc "cd /cygdrive/d/lo; python3 '$ws/apply_patch.py' /cygdrive/d/lo; echo PATCH_RESULT=$?; ls -la sd/source/ui/slideshow/showtoolbar.*"
          if ($LASTEXITCODE -ne 0) { throw "patch failed" }

      - name: Install pkgconf
        shell: pwsh
        run: |
          # LibreOffice 的 configure 会查找名为 pkgconf-2.4.3.exe 的文件。
          # 官方 release 提供 MSI 安装包，安装后重命名即可。
          $msi = "$env:RUNNER_TEMP\pkgconf.msi"
          Invoke-WebRequest -Uri "https://github.com/pkgconf/pkgconf/releases/download/pkgconf-3.0.10/pkgconf-x64-3.0.10.msi" -OutFile $msi -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList @("/i","`"$msi`"","/qn","/norestart","INSTALLDIR=C:\tools\pkgconf") -Wait
          $found = Get-ChildItem "C:\tools\pkgconf" -Recurse -Filter "pkgconf.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $found) {
            # MSI 可能装到 Program Files，兜底搜索
            $found = Get-ChildItem "C:\Program Files" -Recurse -Filter "pkgconf.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $found) { throw "pkgconf.exe not found after install" }
          $dir = Split-Path $found.FullName
          Copy-Item $found.FullName (Join-Path $dir "pkgconf-2.4.3.exe") -Force
          Write-Host "pkgconf dir: $dir"
          Get-ChildItem $dir | Select-Object Name
          "PKGCONF_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        shell: pwsh
        timeout-minutes: 40
        run: |
          $pkgWin = $env:PKGCONF_DIR
          $pkgExe = Join-Path $pkgWin "pkgconf-2.4.3.exe"
          if (-not (Test-Path $pkgExe)) { throw "pkgconf-2.4.3.exe missing" }
          Write-Host "pkgconf: $pkgExe"
          # 直接把这个 exe 拷到无空格的目录，规避路径空格问题
          New-Item -ItemType Directory -Force -Path C:\pk | Out-Null
          Copy-Item $pkgExe C:\pk\pkgconf-2.4.3.exe -Force
          Copy-Item (Join-Path $pkgWin "*.dll") C:\pk\ -Force -ErrorAction SilentlyContinue
          Get-ChildItem C:\pk | Select-Object Name
          $cfg = @(
            "--with-visual-studio=2022",
            "--without-java",
            "--without-doxygen",
            "--without-help",
            "--disable-epm",
            "--disable-odk",
            "--with-parallelism=8",
            "PKG_CONFIG=C:/pk/pkgconf-2.4.3.exe"
          )
          $cfg -join "`n" | Out-File -FilePath D:\lo\autogen.input -Encoding utf8
          & bash -lc "set -e; cd /cygdrive/d/lo; cat autogen.input; ./autogen.sh 2>&1 | tail -60; echo CONFIG_DONE" 
          if (-not (Test-Path "D:\lo\config_host.mk")) {
            Get-Content "D:\lo\config.log" -Tail 60 -ErrorAction SilentlyContinue
            throw "configure failed"
          }
          Write-Host "configure OK"
      - name: Build
        shell: pwsh
        timeout-minutes: 280
        run: |
          $env:PATH = "C:\cygwin\bin;$env:PATH"
          & bash -lc "cd /cygdrive/d/lo; if [ ! -f config_host.mk ]; then echo CONFIG_MISSING; exit 1; fi; make -j8 2>&1 | tail -80; echo MAKE_ATTEMPT_DONE"

      - name: Check output
        if: always()
        shell: pwsh
        run: |
          $env:PATH = "C:\cygwin\bin;$env:PATH"
          & bash -lc "cd /cygdrive/d/lo; if [ -f instdir/program/soffice.exe ]; then echo SOFFICE_EXISTS; else echo SOFFICE_MISSING; fi; ls instdir/program 2>/dev/null | head -20"

      - name: Package
        if: success()
        shell: pwsh
        run: |
          $env:PATH = "C:\cygwin\bin;$env:PATH"
          $ws = & bash -lc "cygpath -u '$env:GITHUB_WORKSPACE'"
          & bash -lc "set -e; cd /cygdrive/d/lo; tar -czf '$ws/libreoffice-impress-toolbar.zip' instdir; du -sh '$ws/libreoffice-impress-toolbar.zip'"

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: libreoffice-impress-toolbar-win64
          path: libreoffice-impress-toolbar.zip
          retention-days: 30
